<!DOCTYPE html>
<html lang="en">

<head>

    <title>Movie Flex</title>
    <link rel="stylesheet" href="style.css">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
    rel="stylesheet"
/>
</head>

<body>
    <div class="home">
        <div class="part" id="p1">
            <img height="20" src="movies-logo.png" alt="">
            <button class="btn">🌟Get Premium</button>
            <i class="ri-star-line">TRENDING</i>
            <i class="ri-movie-line">movies</i>
            <i class="ri-tv-2-line">tv series</i>
            <i class="ri-tv-line">new episodes</i>
            <i class="ri-calendar-todo-line">calendar</i>
            <i class="ri-mail-open-fill">contact us</i>
            <button class="btn1">🤍favorites</button>
            <div class="note">
                Terms of use<br>
                Privacy Policy
            </div>
        </div>
        <div class="part" id="p2">
            <i class="ri-search-2-line">Search what to Watch👀</i>
            <div class="show">tv show</div>    
        </div>
        <div class="part" id="p3">
           <div class="box" id="b1"></div>
           <div class="box" id="b2"></div>
           <div class="box" id="b3"></div>
           <div class="box" id="b4"></div>
           <div class="box" id="b5"></div>
           <div class="box" id="b6"></div>
           <div class="box" id="b7"></div>
           <div class="box" id="b8"></div>
           <div class="box" id="b9"></div>
           <div class="box" id="b10"></div>
        </div>
    </div>
</body>

</html>
